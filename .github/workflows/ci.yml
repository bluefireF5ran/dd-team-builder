# Runs the two commands that already have to pass before anything is worth
# looking at. Not a deployment pipeline - this project is not published - just
# a net for the failures you would otherwise find three weeks later.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # 24 porque es lo que corre en local: si el CI compila con otro Node
          # que la maquina donde se escriben las comps, el verde de aqui deja de
          # decir nada sobre el de alli. Node 20 ademas ya esta fuera de soporte.
          node-version: '24'
          # Explicito a proposito. Desde setup-node v5 hay cacheo automatico,
          # pero solo si package.json trae campo `packageManager`, y no lo trae.
          cache: npm
      # `npm ci` runs the patch-package postinstall, which the react-scripts
      # patch in patches/ depends on.
      - run: npm ci
      # Both go through npm so the prebuild/pretest hooks regenerate the preset
      # comp barrel first; calling react-scripts directly would skip that and
      # fail presetCompsIndex.test.js on a freshly added comp.
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: true
